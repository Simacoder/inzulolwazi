- id: q_vague_01
  claim: null
  language: en
  question: What is the history of Africa?
  expected: abstain_no_matching_source
  known_issue: "Matches draft claims only on the word 'history' (scores 0.125 to 0.141, above the 0.08 threshold). Raise the threshold or require a distinctive keyword match, then tune on a larger set."
- id: q_mismatch_01
  claim: null
  language: en
  question: Who were the first people in southern Africa?
  expected: abstain_no_matching_source
  known_issue: "Retrieves the Giza claim (score 0.141) because the claim text contains the word 'people'. Once Giza is published this would produce a wrong cited answer."
- id: q_generic_01
  claim: null
  language: en
  question: What is a language?
  expected: abstain_no_matching_source
  known_issue: "Retrieves the Bantu claim (score 0.201) on the word 'language'. Same cause as q_mismatch_01."
