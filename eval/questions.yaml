# Evaluation prompts. Run with `npm run eval`.
#
# expected:
#   abstain_until_claim_reviewed  the claim is retrieved but withheld, because it is a draft
#   abstain_no_matching_source    nothing in the corpus matches, and the app says so
#   answer                        a published claim is used, with a valid citation on every sentence
#
# known_issue: a question that currently fails. It is reported as a known issue and does not
# fail the run. Remove the note when the question passes.
#
# isiZulu questions must be written or checked by a fluent speaker before results are reported.
- id: q_giza_01
  claim: claim_giza_builders
  language: en
  question: Who built the pyramids at Giza?
  expected: abstain_until_claim_reviewed
- id: q_zimbabwe_01
  claim: claim_great_zimbabwe_trade
  language: en
  question: What evidence is there of trade at Great Zimbabwe?
  expected: abstain_until_claim_reviewed
